# Abstract:
#   Builds and tests the Linux port of Files (src/Files.App.Linux) and
#   produces Debian packages (.deb) for amd64 and arm64 as build artifacts.

name: Files Linux CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/Files.App.Linux/**'
      - 'src/Files.App/Strings/**'
      - 'tests/Files.App.Linux.Tests/**'
      - 'packaging/linux/**'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - '.github/workflows/ci-linux.yml'
  pull_request:
    paths:
      - 'src/Files.App.Linux/**'
      - 'src/Files.App/Strings/**'
      - 'tests/Files.App.Linux.Tests/**'
      - 'packaging/linux/**'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - '.github/workflows/ci-linux.yml'
  workflow_dispatch:

jobs:

  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the repository
      uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json
    - name: Build
      run: dotnet build Files.Linux.slnx -c Release
    - name: Test
      run: dotnet run --project tests/Files.App.Linux.Tests -c Release --no-build
      env:
        FILES_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/screenshots
    - name: Upload screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: screenshots
        path: artifacts/screenshots
        if-no-files-found: ignore

  package:
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
    - name: Checkout the repository
      uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json
    - name: Build the .deb
      run: packaging/linux/build-deb.sh ${{ matrix.arch }} 1.0.${{ github.run_number }}
    - name: Upload the .deb
      uses: actions/upload-artifact@v4
      with:
        name: files-app-${{ matrix.arch }}
        path: artifacts/linux/*.deb
